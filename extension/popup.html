<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 24px;
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .subtitle {
      font-size: 11px;
      color: var(--text-dim);
      margin: 2px 0 0 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-text {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
      margin: 0;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(109, 40, 217, 0.4);
      filter: brightness(1.1);
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
    }
    .footer a {
      color: var(--primary);
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h1 class="title">Wormhole Copilot</h1>
      <p class="subtitle">DSU ERP Attendance Sync</p>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title">🚀 Instant 1-Click Sync</h3>
    <p class="card-text">
      Navigate to your ERP Attendance Summary page, and click the floating <b>"Sync to Wormhole"</b> button at the bottom-right corner!
    </p>
  </div>

  <button id="openErpBtn" class="btn">🔑 Go to DSU ERP Portal</button>

  <div style="margin-top: 20px;" class="footer">
    Wormhole is powered by Antigravity AI
  </div>

  <script src="popup.js"></script>
</body>
</html>
